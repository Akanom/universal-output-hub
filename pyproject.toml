[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-output-hub"
version = "0.2.3"
description = "Collect model outputs, tables, diagnostics, and graphs into reproducible research-output bundles."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Oluwajuwon Akanbi"}]
license = "MIT"
keywords = ["regression", "econometrics", "reporting", "stata", "outreg2", "latex", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "tabulate>=0.9.0",
    "Jinja2>=3.1.0",
    "reportlab>=4.0",
    "python-docx>=1.1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.7", "statsmodels>=0.14", "numpy>=1.24"]
dev = ["pytest>=7.4", "ruff>=0.4"]
integration = ["statsmodels>=0.14", "linearmodels>=7.0", "pyfixest>=0.30", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_output_hub*"]

[project.urls]
Homepage = "https://github.com/Akanom/universal-output-hub"
Repository = "https://github.com/Akanom/universal-output-hub"
Issues = "https://github.com/Akanom/universal-output-hub/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

