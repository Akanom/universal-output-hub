[build-system]
requires = ["setuptools>=68,<84", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-output-hub"
version = "0.2.4"
description = "Collect model outputs, tables, diagnostics, and graphs into reproducible research-output bundles."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Oluwajuwon Akanbi"}]
license = "MIT"
keywords = ["regression", "econometrics", "reporting", "stata", "outreg2", "latex", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "jinja2>=3.1,<4",
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
documents = ["python-docx>=1.1,<2"]
pdf = ["reportlab>=4.1,<6"]
parquet = ["pyarrow>=15,<26"]
reports = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "reportlab>=4.1,<6"]
examples = ["matplotlib>=3.7,<4", "statsmodels>=0.14,<1"]
test = ["openpyxl>=3.1,<4", "pytest>=7.4,<10", "python-docx>=1.1,<2", "reportlab>=4.1,<6", "ruff>=0.4,<1", "tomli>=2,<3; python_version < '3.11'"]
dev = ["build>=1.2,<2", "openpyxl>=3.1,<4", "pytest>=7.4,<10", "python-docx>=1.1,<2", "reportlab>=4.1,<6", "ruff>=0.4,<1", "tomli>=2,<3; python_version < '3.11'", "twine>=5,<8"]
integration = ["statsmodels>=0.14,<1", "linearmodels>=7,<8", "pyfixest>=0.30,<1", "scikit-learn>=1.4,<2"]
all = ["openpyxl>=3.1,<4", "pyarrow>=15,<26", "python-docx>=1.1,<2", "reportlab>=4.1,<6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_output_hub*"]

[project.urls]
Homepage = "https://github.com/Akanom/universal-output-hub"
Repository = "https://github.com/Akanom/universal-output-hub"
Issues = "https://github.com/Akanom/universal-output-hub/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

