name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,examples,integration]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install "jinja2==3.1.2" "numpy==1.24.0" "pandas==2.0.0" "openpyxl==3.1.0" "python-docx==1.1.0" "reportlab==4.1.0" "scikit-learn==1.4.0" "tabulate==0.9.0" "tomli==2.0.1" "pytest>=7.4,<10"
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q

  governance-security:
    uses: Akanom/python-package-governance/.github/workflows/reusable-security.yml@f3147a43f2857dfdc033d563932f0c21a4fbb44d
    with:
      python_version: "3.12"
      requirements_file: requirements/test.txt
      release_requirements_file: requirements/release.txt

  governance-build:
    uses: Akanom/python-package-governance/.github/workflows/reusable-build.yml@f3147a43f2857dfdc033d563932f0c21a4fbb44d
    with:
      python_version: "3.12"
      requirements_file: requirements/release.txt
      import_name: universal_output_hub
